name: Julia Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — allows workflows to run safely from fork PRs
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Run unit tests
        run: julia --project=. -e 'using Pkg; Pkg.test("RandESC"; test_args=["unit"])'

  dftk-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Run DFTK silicon integration test
        run: julia --project=. -e 'using Pkg; Pkg.test("RandESC"; test_args=["integration"])'
